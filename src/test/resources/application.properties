# 測試用設定：使用 in-memory H2，不碰正式的 ./data 檔案資料庫
spring.datasource.url=jdbc:h2:mem:bddtest;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

server.error.include-message=always

# 測試期間排程不要真的觸發（設在遙遠時間點）
housekeeping.cron=0 0 20 * * *

# 測試期間意見回饋功能一律視為未設定，避免受開發機上真實的 data/feedback.properties 影響
feedback.file=./data-test-nonexistent/feedback.properties

# 測試期間 Entra ID 登入一律視為未設定，避免受開發機上真實的 data/entra.properties 影響
entra.file=./data-test-nonexistent/entra.properties
