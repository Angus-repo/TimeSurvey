<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>時間調查</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; margin: 0; background: #f0f2f5; color: #333; }
  header { background: #00a884; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 6px 0 0; font-size: 13px; opacity: .9; }
  .container { max-width: 1100px; margin: 24px auto; padding: 0 16px 70px; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 16px 20px; margin-bottom: 16px; }
  label { font-size: 14px; color: #555; }
  select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; font-family: inherit; min-width: 200px; }
  .hint { font-size: 13px; color: #999; margin-left: 8px; }

  /* 時段表格：每個日期一列，同一小時的 :00/:30 上下兩格 */
  .gridwrap { overflow-x: auto; }
  .gridwrap.locked { opacity: .5; }   /* 未選姓名前格線半透明，提示先選姓名 */
  table.grid { border-collapse: separate; border-spacing: 3px; width: 100%; }
  table.grid thead th { font-size: 13px; color: #777; font-weight: 600; padding: 4px 2px; }
  .datecell { background: #f7f9f8; border: 1px solid #e2e8e5; border-radius: 6px; padding: 8px 10px;
              text-align: left; vertical-align: top; min-width: 132px; }
  .datecell .dname { font-size: 15px; color: #2c3e50; font-weight: 700; margin-bottom: 6px; white-space: nowrap; }
  .quick { display: flex; gap: 4px; flex-wrap: wrap; }
  .quick label { display: inline-flex; align-items: center; background: #eef6f3; border: 1px solid #bfe3d8;
                 border-radius: 12px; padding: 2px 9px; cursor: pointer; font-size: 12px; user-select: none; white-space: nowrap; }
  .quick label.on { background: #00a884; border-color: #00a884; color: #fff; }
  td.hourcell { padding: 0; vertical-align: top; }
  td.na { border: none; background: transparent; }
  /* 每個「日期×小時」一個外框，框住 :00 / :30 上下兩格 */
  .hbox { position: relative; border: 1.5px solid #d8dee2; border-radius: 8px; padding: 4px; margin-top: 9px;
          display: flex; flex-direction: column; gap: 4px; min-width: 58px; background: #fbfcfc;
          transition: border-color .15s, background .15s; }
  .hbox.full { border-color: #00a884; background: #f2fbf8; }
  .slot { border: 1px solid #ccc; border-radius: 4px; padding: 6px 4px; font-size: 13px; text-align: center;
          cursor: pointer; user-select: none; background: #fff; white-space: nowrap; }
  .slot.on { background: #00a884; border-color: #00a884; color: #fff; }
  /* 外框右上角的圓形勾勾徽章：勾起＝該小時兩格全選 */
  .chk { position: absolute; top: -9px; right: -9px; width: 22px; height: 22px; border-radius: 50%;
         display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2;
         background: #fff; border: 2px solid #cfd8d4; color: #cfd8d4; font-size: 13px; font-weight: 700;
         line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.18); user-select: none;
         transition: background .15s, border-color .15s, color .15s, transform .15s; }
  .chk:hover { border-color: #00a884; color: #00a884; transform: scale(1.12); }
  .chk.on { background: linear-gradient(135deg, #00c389, #00a884); border-color: #00a884; color: #fff; }

  .submit-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; box-shadow: 0 -2px 8px rgba(0,0,0,.1);
                padding: 10px 16px; text-align: center; }
  .submit-bar button { background: #2c7be5; color: #fff; border: none; border-radius: 6px;
                       padding: 10px 40px; font-size: 16px; cursor: pointer; font-family: inherit; }
  .submit-bar button:hover { background: #1a68d1; }
  .submit-bar .count { font-size: 13px; color: #777; margin-right: 16px; }
  .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #333; color: #fff;
           padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  .err { text-align: center; color: #e74c3c; margin-top: 60px; font-size: 16px; }
  .muted { color: #999; font-size: 13px; }

  /* 首次開啟的新手引導：壓暗背景、打亮姓名卡片、浮出指引泡泡 */
  .onb-mask { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 1000; }
  #whoCard { position: relative; }
  #whoCard.onb-spot { z-index: 1001; animation: onbpulse 1.6s ease-in-out infinite; }
  @keyframes onbpulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(0,168,132,.95), 0 8px 30px rgba(0,0,0,.45); }
    50%      { box-shadow: 0 0 0 10px rgba(0,168,132,.35), 0 8px 30px rgba(0,0,0,.45); }
  }
  .onb-pop { position: absolute; top: calc(100% + 14px); left: 24px; z-index: 1002; background: #fff;
             border-radius: 10px; padding: 16px 20px; max-width: 360px; font-size: 14px; line-height: 1.7;
             box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .onb-pop::before { content: ''; position: absolute; bottom: 100%; left: 36px;
                     border: 9px solid transparent; border-bottom-color: #fff; }
  .onb-pop b { color: #00a884; }
  .onb-pop button { margin-top: 10px; background: #00a884; color: #fff; border: none; border-radius: 6px;
                    padding: 7px 22px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .onb-pop button:hover { background: #008f70; }

  /* 送出後的完成畫面 */
  #done .card { padding: 24px 28px; }
  #done h2 { margin: 0 0 12px; font-size: 19px; color: #0a7d57; }
  .dday { margin: 6px 0; font-size: 14px; }
  .dday .dlabel { display: inline-block; min-width: 110px; font-weight: 600; color: #2c3e50; }
  .chip { display: inline-block; margin: 2px 8px 2px 0; padding: 4px 14px; border-radius: 14px; font-size: 13px;
          background: #d2f4e8; color: #0a7d57; border: 1px solid #9fdec6; white-space: nowrap; }
  .btn-edit { margin-top: 14px; background: #f39c12; color: #fff; border: none; border-radius: 6px;
              padding: 9px 24px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .btn-edit:hover { background: #d9890e; }
  #done hr { border: none; border-top: 1px solid #eee; margin: 20px 0 14px; }
  .btn-new { display: inline-block; background: #2c7be5; color: #fff; border-radius: 6px;
             padding: 9px 24px; font-size: 14px; text-decoration: none; }
  .btn-new:hover { background: #1a68d1; }
  .ownlink { text-align: center; margin-top: 4px; }
  .ownlink a { color: #2c7be5; font-size: 13px; text-decoration: none; }
  .ownlink a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1 id="title">時間調查</h1>
  <p id="subtitle"></p>
</header>
<div class="container" id="main" style="display:none">
  <div class="card" id="whoCard">
    <label>您的姓名：</label>
    <select id="who"><option value="">-- 請選擇 --</option></select>
    <span class="hint">選擇後請勾選您可以出席的時間（可點全天、上午、下午快速鈕、各小時框右上角的勾勾整時選取，或個別 30 分鐘時段）</span>
    <div class="onb-pop" id="onbPop" style="display:none">
      👋 歡迎！<b>請先在這裡選擇您的姓名</b><br>
      選好之後，下方的時段表格才會開放，點選您可以出席的時間再送出即可。
      <div><button onclick="endOnboarding()">知道了</button></div>
    </div>
  </div>
  <div class="card gridwrap" id="gridCard"></div>
  <div class="ownlink">想調查大家的時間嗎？<a href="/" target="_blank">您也可以發起自己的會議時間調查 →</a></div>
</div>
<div class="container" id="done" style="display:none">
  <div class="card">
    <h2>✅ 已送出！感謝您的填寫</h2>
    <p><b id="doneName"></b>，以下是您勾選的可出席時間：</p>
    <div id="doneList"></div>
    <button class="btn-edit" onclick="backToEdit()">修改填寫內容</button>
    <hr>
    <p class="muted">想調查大家的時間嗎？您也可以發起自己的會議時間調查：</p>
    <a class="btn-new" href="/" target="_blank">➕ 建立我自己的時間調查</a>
  </div>
</div>
<div class="onb-mask" id="onbMask" style="display:none" onclick="endOnboarding()"></div>
<div class="err" id="err" style="display:none"></div>
<div class="submit-bar" id="bar" style="display:none">
  <span class="count" id="count">已勾選 0 個時段</span>
  <button onclick="submitResponse()">送出我的可出席時間</button>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const surveyId = location.pathname.split('/')[2];

let survey = null;
let selected = new Set();   // "yyyy-MM-ddTHH:mm"
let times = [], amTimes = [], pmTimes = [], hours = [];

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function dateList(start, end) {
  const out = [];
  let d = new Date(start + 'T00:00:00');
  const e = new Date(end + 'T00:00:00');
  while (d <= e) {
    // 跳過週六(6)、週日(0)
    if (d.getDay() !== 0 && d.getDay() !== 6) {
      out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
    }
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function timeSlots(startTime, endTime) {
  const out = [];
  let [h, m] = startTime.slice(0,5).split(':').map(Number);
  const [eh, em] = endTime.slice(0,5).split(':').map(Number);
  while (h * 60 + m < eh * 60 + em) {
    const t = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
    // 12:00~13:00 為午休，不列入調查時段
    if (t < '12:00' || t >= '13:00') out.push(t);
    m += 30;
    if (m >= 60) { m -= 60; h++; }
  }
  return out;
}

const WEEK = ['日','一','二','三','四','五','六'];

async function init() {
  if (!surveyId) return showErr('連結不正確');
  let res = await fetch('/api/surveys/' + surveyId);
  if (!res.ok) return showErr('找不到這份調查，請確認連結是否正確。');
  survey = await res.json();

  $('title').textContent = survey.name;
  $('subtitle').textContent = '調查期間：' + survey.startDate + ' ~ ' + survey.endDate +
      '，每日 ' + survey.startTime.slice(0,5) + ' ~ ' + survey.endTime.slice(0,5) + '（不含週六日及 12:00~13:00 午休）';

  // 已結束的調查不開放填寫
  if (survey.closedAt) {
    return showErr('📋 本調查已結束，無法再填寫時間。如有疑問請聯絡調查發起人。');
  }

  const who = $('who');
  for (const p of survey.participants) {
    const opt = document.createElement('option');
    opt.value = opt.textContent = p;
    who.appendChild(opt);
  }
  who.onchange = loadMyResponse;

  times = timeSlots(survey.startTime, survey.endTime);
  amTimes = times.filter(t => t < '12:00');
  pmTimes = times.filter(t => t >= '13:00');   // 下午從 13:00 開始
  hours = [...new Set(times.map(t => t.slice(0, 2)))];

  renderGrid();
  $('gridCard').classList.add('locked');   // 進頁面尚未選姓名，先鎖定格線
  $('main').style.display = '';
  $('bar').style.display = '';

  // 首次開啟：以新手引導提示先選擇姓名（看過一次就不再出現）
  if (!localStorage.getItem('surveyOnboarded')) startOnboarding();
}

/* ---------- 新手引導 ---------- */
function startOnboarding() {
  $('onbMask').style.display = '';
  $('onbPop').style.display = '';
  $('whoCard').classList.add('onb-spot');
}

function endOnboarding() {
  localStorage.setItem('surveyOnboarded', '1');
  $('onbMask').style.display = 'none';
  $('onbPop').style.display = 'none';
  $('whoCard').classList.remove('onb-spot');
  $('who').focus();
}

function showErr(msg) {
  $('err').textContent = msg;
  $('err').style.display = '';
}

/* 某日某小時的全部時段鍵值（例如 "2026-06-15"×"09" -> 09:00、09:30） */
function dayHourSlots(d, h) {
  return times.filter(t => t.slice(0, 2) === h).map(t => d + 'T' + t);
}

/* 還沒選姓名前不可勾時段：切換姓名會重載該人內容，先勾的會被清掉造成誤會 */
function requireName() {
  if (!$('who').value) {
    toast('請先選擇您的姓名，再勾選時段');
    return false;
  }
  return true;
}

function renderGrid() {
  const dates = dateList(survey.startDate, survey.endDate);
  if (dates.length === 0) {
    return showErr('調查日期範圍內沒有工作日（週六日不列入調查），請聯絡調查發起人調整日期。');
  }

  let html = '<table class="grid"><thead><tr><th style="text-align:left">日期 \\ 時間</th>';
  for (const h of hours) html += '<th>' + h + '時</th>';
  html += '</tr></thead><tbody>';

  // 每個「日期×小時」一個外框：右上角勾勾＋框內 :00/:30 兩格
  const hourCell = (d, h) => {
    const ts = times.filter(t => t.slice(0, 2) === h);
    if (ts.length === 0) return '<td class="na"></td>';
    let box = '<td class="hourcell"><div class="hbox" data-date="' + d + '" data-hour="' + h + '">' +
              '<span class="chk" data-date="' + d + '" data-hour="' + h + '">✓</span>';
    for (const t of ts) box += '<div class="slot" data-slot="' + d + 'T' + t + '">' + t + '</div>';
    return box + '</div></td>';
  };

  for (const d of dates) {
    const w = WEEK[new Date(d + 'T00:00:00').getDay()];
    const md = d.slice(5).replace('-', '/');
    html += '<tr><th class="datecell"><div class="dname">' + md + '（週' + w + '）</div>' +
            '<div class="quick" data-date="' + d + '">' +
            '<label data-grp="all">全天</label>' +
            (amTimes.length ? '<label data-grp="am">上午</label>' : '') +
            (pmTimes.length ? '<label data-grp="pm">下午</label>' : '') +
            '</div></th>';
    for (const h of hours) html += hourCell(d, h);
    html += '</tr>';
  }
  html += '</tbody></table>';
  $('gridCard').innerHTML = html;

  // 個別 30 分鐘時段點擊
  document.querySelectorAll('.slot').forEach(el => {
    el.addEventListener('click', () => {
      if (!requireName()) return;
      const s = el.dataset.slot;
      selected.has(s) ? selected.delete(s) : selected.add(s);
      refreshAll();
    });
  });
  // 右上角勾勾：一次選取/取消該日該小時的兩格
  document.querySelectorAll('.chk').forEach(el => {
    el.addEventListener('click', () => {
      if (!requireName()) return;
      const list = dayHourSlots(el.dataset.date, el.dataset.hour);
      const allOn = list.length > 0 && list.every(s => selected.has(s));
      for (const s of list) allOn ? selected.delete(s) : selected.add(s);
      refreshAll();
    });
  });
  // 全天 / 上午 / 下午 快速鈕
  document.querySelectorAll('.quick label').forEach(el => {
    el.addEventListener('click', () => {
      if (!requireName()) return;
      const d = el.parentElement.dataset.date;
      const grp = el.dataset.grp;
      const list = (grp === 'all' ? times : grp === 'am' ? amTimes : pmTimes).map(t => d + 'T' + t);
      const allOn = list.every(s => selected.has(s));
      for (const s of list) allOn ? selected.delete(s) : selected.add(s);
      refreshAll();
    });
  });
  refreshAll();
}

function refreshAll() {
  document.querySelectorAll('.slot').forEach(el => {
    el.classList.toggle('on', selected.has(el.dataset.slot));
  });
  // 各小時外框：兩格全選時勾勾亮起、外框變綠
  document.querySelectorAll('.hbox').forEach(box => {
    const list = dayHourSlots(box.dataset.date, box.dataset.hour);
    const full = list.length > 0 && list.every(s => selected.has(s));
    box.classList.toggle('full', full);
    box.querySelector('.chk').classList.toggle('on', full);
  });
  document.querySelectorAll('.quick').forEach(q => {
    const d = q.dataset.date;
    const isOn = list => list.length > 0 && list.every(t => selected.has(d + 'T' + t));
    q.querySelectorAll('label').forEach(el => {
      const grp = el.dataset.grp;
      el.classList.toggle('on', isOn(grp === 'all' ? times : grp === 'am' ? amTimes : pmTimes));
    });
  });
  $('count').textContent = '已勾選 ' + selected.size + ' 個時段';
}

async function loadMyResponse() {
  const name = $('who').value;
  if (name && $('whoCard').classList.contains('onb-spot')) endOnboarding();   // 選了姓名即完成引導
  $('gridCard').classList.toggle('locked', !name);
  selected = new Set();
  if (name) {
    const res = await fetch('/api/surveys/' + surveyId + '/responses');
    if (res.ok) {
      const list = await res.json();
      const mine = list.find(r => r.participantName === name);
      if (mine && mine.slots) {
        selected = new Set(mine.slots.split(',').filter(x => x));
        toast('已載入您先前填寫的內容，可直接修改後再送出');
      }
    }
  }
  refreshAll();
}

async function submitResponse() {
  const name = $('who').value;
  if (!name) return toast('請先選擇您的姓名');
  const res = await fetch('/api/surveys/' + surveyId + '/responses', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ participantName: name, slots: [...selected].sort().join(',') })
  });
  if (res.ok) {
    showDone(name);
  } else {
    let msg = '送出失敗，請稍後再試';
    try { msg = (await res.json()).message || msg; } catch (e) {}
    toast(msg);
  }
}

/* ---------- 送出後的完成畫面 ---------- */
const toMin = t => (+t.slice(0,2)) * 60 + (+t.slice(3,5));

/* "10:30" + 30分 -> "11:00" */
function plus30(t) {
  let h = +t.slice(0,2), m = +t.slice(3,5) + 30;
  if (m >= 60) { m -= 60; h++; }
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

/* 隱藏填寫表單，改顯示這次送出的內容摘要（連續時段合併為區間） */
function showDone(name) {
  const byDate = {};
  for (const s of [...selected].sort()) {
    const [d, t] = s.split('T');
    (byDate[d] = byDate[d] || []).push(t);
  }
  const dates = Object.keys(byDate).sort();
  let html = '';
  if (dates.length === 0) {
    html = '<p class="muted">您沒有勾選任何時段（表示這段期間都無法出席）。</p>';
  } else {
    for (const d of dates) {
      const w = WEEK[new Date(d + 'T00:00:00').getDay()];
      const ts = byDate[d];
      const ranges = [];
      let start = ts[0], prev = ts[0];
      for (let i = 1; i <= ts.length; i++) {
        const cur = ts[i];
        if (cur && toMin(cur) === toMin(prev) + 30) { prev = cur; continue; }
        ranges.push(start + ' ~ ' + plus30(prev));
        start = prev = cur;
      }
      html += '<div class="dday"><span class="dlabel">' + d.slice(5).replace('-', '/') + '（週' + w + '）</span>' +
              ranges.map(r => '<span class="chip">' + r + '</span>').join('') + '</div>';
    }
  }
  $('doneName').textContent = name;
  $('doneList').innerHTML = html;
  $('main').style.display = 'none';
  $('bar').style.display = 'none';
  $('done').style.display = '';
  window.scrollTo({ top: 0 });
}

/* 回到表單繼續修改（重新進入網址也同樣可重新填寫） */
function backToEdit() {
  $('done').style.display = 'none';
  $('main').style.display = '';
  $('bar').style.display = '';
}

init();
</script>
</body>
</html>
