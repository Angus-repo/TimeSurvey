<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>時間調查</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; margin: 0; background: #f0f2f5; color: #333; }
  header { background: #00a884; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 6px 0 0; font-size: 13px; opacity: .9; }
  .container { max-width: 900px; margin: 24px auto; padding: 0 16px 60px; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 16px 20px; margin-bottom: 16px; }
  label { font-size: 14px; color: #555; }
  select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; font-family: inherit; min-width: 200px; }
  .day-card h3 { margin: 0 0 10px; font-size: 16px; color: #2c3e50; }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .quick label { display: inline-flex; align-items: center; gap: 5px; background: #eef6f3; border: 1px solid #bfe3d8;
                 border-radius: 16px; padding: 5px 12px; cursor: pointer; font-size: 14px; user-select: none; }
  .quick label.on { background: #00a884; border-color: #00a884; color: #fff; }
  .quick input { display: none; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; }
  .slot { display: flex; align-items: center; justify-content: center; border: 1px solid #ccc; border-radius: 4px;
          padding: 6px 2px; font-size: 13px; cursor: pointer; user-select: none; background: #fff; }
  .slot.on { background: #00a884; border-color: #00a884; color: #fff; }
  .slot input { display: none; }
  .submit-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; box-shadow: 0 -2px 8px rgba(0,0,0,.1);
                padding: 10px 16px; text-align: center; }
  .submit-bar button { background: #2c7be5; color: #fff; border: none; border-radius: 6px;
                       padding: 10px 40px; font-size: 16px; cursor: pointer; font-family: inherit; }
  .submit-bar button:hover { background: #1a68d1; }
  .submit-bar .count { font-size: 13px; color: #777; margin-right: 16px; }
  .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #333; color: #fff;
           padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  .err { text-align: center; color: #e74c3c; margin-top: 60px; font-size: 16px; }
</style>
</head>
<body>
<header>
  <h1 id="title">時間調查</h1>
  <p id="subtitle"></p>
</header>
<div class="container" id="main" style="display:none">
  <div class="card">
    <label>您的姓名：</label>
    <select id="who"><option value="">-- 請選擇 --</option></select>
    <span style="font-size:13px;color:#999;margin-left:8px">選擇後請勾選您可以出席的時間（可勾選全天、上午、下午或個別 30 分鐘時段）</span>
  </div>
  <div id="days"></div>
</div>
<div class="err" id="err" style="display:none"></div>
<div class="submit-bar" id="bar" style="display:none">
  <span class="count" id="count">已勾選 0 個時段</span>
  <button onclick="submitResponse()">送出我的可出席時間</button>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const surveyId = location.pathname.split('/')[2];

let survey = null;
let selected = new Set();   // "yyyy-MM-ddTHH:mm"
let allResponses = [];

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function dateList(start, end) {
  const out = [];
  let d = new Date(start + 'T00:00:00');
  const e = new Date(end + 'T00:00:00');
  while (d <= e) {
    out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function timeSlots(startTime, endTime) {
  const out = [];
  let [h, m] = startTime.slice(0,5).split(':').map(Number);
  const [eh, em] = endTime.slice(0,5).split(':').map(Number);
  while (h * 60 + m < eh * 60 + em) {
    out.push(String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'));
    m += 30;
    if (m >= 60) { m -= 60; h++; }
  }
  return out;
}

const WEEK = ['日','一','二','三','四','五','六'];

async function init() {
  if (!surveyId) return showErr('連結不正確');
  let res = await fetch('/api/surveys/' + surveyId);
  if (!res.ok) return showErr('找不到這份調查，請確認連結是否正確。');
  survey = await res.json();

  $('title').textContent = survey.name;
  $('subtitle').textContent = '調查期間：' + survey.startDate + ' ~ ' + survey.endDate +
      '，每日 ' + survey.startTime.slice(0,5) + ' ~ ' + survey.endTime.slice(0,5);

  const who = $('who');
  for (const p of survey.participants) {
    const opt = document.createElement('option');
    opt.value = opt.textContent = p;
    who.appendChild(opt);
  }
  who.onchange = loadMyResponse;

  renderDays();
  $('main').style.display = '';
  $('bar').style.display = '';
}

function showErr(msg) {
  $('err').textContent = msg;
  $('err').style.display = '';
}

function renderDays() {
  const dates = dateList(survey.startDate, survey.endDate);
  const times = timeSlots(survey.startTime, survey.endTime);
  const container = $('days');
  container.innerHTML = '';

  for (const d of dates) {
    const w = WEEK[new Date(d + 'T00:00:00').getDay()];
    const card = document.createElement('div');
    card.className = 'card day-card';
    card.dataset.date = d;

    const amTimes = times.filter(t => t < '12:00');
    const pmTimes = times.filter(t => t >= '12:00');

    let quick = '<div class="quick">' +
      '<label data-grp="all"><input type="checkbox">全天</label>';
    if (amTimes.length) quick += '<label data-grp="am"><input type="checkbox">上午</label>';
    if (pmTimes.length) quick += '<label data-grp="pm"><input type="checkbox">下午</label>';
    quick += '</div>';

    let slotsHtml = '<div class="slots">';
    for (const t of times) {
      slotsHtml += '<label class="slot" data-slot="' + d + 'T' + t + '"><input type="checkbox">' + t + '</label>';
    }
    slotsHtml += '</div>';

    card.innerHTML = '<h3>' + d + '（週' + w + '）</h3>' + quick + slotsHtml;
    container.appendChild(card);

    // 個別時段點擊
    card.querySelectorAll('.slot').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        toggleSlot(el.dataset.slot);
      });
    });
    // 全天 / 上午 / 下午
    card.querySelectorAll('.quick label').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        const grp = el.dataset.grp;
        const list = (grp === 'all' ? times : grp === 'am' ? amTimes : pmTimes).map(t => d + 'T' + t);
        const allOn = list.every(s => selected.has(s));
        for (const s of list) allOn ? selected.delete(s) : selected.add(s);
        refreshDay(card, times, amTimes, pmTimes);
        updateCount();
      });
    });
  }
  refreshAll();
}

function toggleSlot(slot) {
  selected.has(slot) ? selected.delete(slot) : selected.add(slot);
  refreshAll();
}

function refreshAll() {
  const times = timeSlots(survey.startTime, survey.endTime);
  const amTimes = times.filter(t => t < '12:00');
  const pmTimes = times.filter(t => t >= '12:00');
  document.querySelectorAll('.day-card').forEach(card => refreshDay(card, times, amTimes, pmTimes));
  updateCount();
}

function refreshDay(card, times, amTimes, pmTimes) {
  const d = card.dataset.date;
  card.querySelectorAll('.slot').forEach(el => {
    el.classList.toggle('on', selected.has(el.dataset.slot));
  });
  const isOn = list => list.length > 0 && list.every(t => selected.has(d + 'T' + t));
  card.querySelectorAll('.quick label').forEach(el => {
    const grp = el.dataset.grp;
    el.classList.toggle('on', isOn(grp === 'all' ? times : grp === 'am' ? amTimes : pmTimes));
  });
}

function updateCount() {
  $('count').textContent = '已勾選 ' + selected.size + ' 個時段';
}

async function loadMyResponse() {
  const name = $('who').value;
  selected = new Set();
  if (name) {
    const res = await fetch('/api/surveys/' + surveyId + '/responses');
    if (res.ok) {
      const list = await res.json();
      const mine = list.find(r => r.participantName === name);
      if (mine && mine.slots) {
        selected = new Set(mine.slots.split(',').filter(x => x));
        toast('已載入您先前填寫的內容，可直接修改後再送出');
      }
    }
  }
  refreshAll();
}

async function submitResponse() {
  const name = $('who').value;
  if (!name) return toast('請先選擇您的姓名');
  const res = await fetch('/api/surveys/' + surveyId + '/responses', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ participantName: name, slots: [...selected].sort().join(',') })
  });
  if (res.ok) {
    toast('已送出！感謝您的填寫 🎉');
  } else {
    let msg = '送出失敗，請稍後再試';
    try { msg = (await res.json()).message || msg; } catch (e) {}
    toast(msg);
  }
}

init();
</script>
</body>
</html>
