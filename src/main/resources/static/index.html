<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>時間調查 - 後台維護</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; margin: 0; background: #f0f2f5; color: #333; }
  header { background: #2c3e50; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 20px; margin-bottom: 24px; }
  .card h2 { margin-top: 0; font-size: 17px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; font-family: inherit; }
  textarea { resize: vertical; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .row > div { flex: 1; min-width: 150px; }
  button { cursor: pointer; border: none; border-radius: 4px; padding: 8px 16px; font-size: 14px; font-family: inherit; }
  .btn-primary { background: #2c7be5; color: #fff; }
  .btn-primary:hover { background: #1a68d1; }
  .btn-sm { padding: 4px 10px; font-size: 13px; margin-right: 4px; }
  /* 清單操作的圖示按鈕：平時淺底彩色線條圖示，滑過時填滿動作色 */
  .ops { display: flex; gap: 6px; }
  .btn-ic { width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
            background: #f4f6f8; border: 1px solid #e4e8ec; border-radius: 8px; color: var(--c, #5a6470);
            transition: background .15s, color .15s, box-shadow .15s, transform .15s; }
  .btn-ic svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2;
                stroke-linecap: round; stroke-linejoin: round; }
  .btn-ic:hover { background: var(--c); border-color: var(--c); color: #fff;
                  transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,.18); }
  /* 自製提示框：滑上立即顯示（原生 title 要等 1~2 秒） */
  .btn-ic { position: relative; }
  .btn-ic::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%;
                   transform: translateX(-50%); background: #2c3e50; color: #fff; font-size: 12px;
                   padding: 6px 10px; border-radius: 6px; white-space: nowrap; opacity: 0; visibility: hidden;
                   transition: opacity .08s; pointer-events: none; z-index: 30;
                   box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .btn-ic::before { content: ''; position: absolute; bottom: calc(100% + 3px); left: 50%;
                    transform: translateX(-50%); border: 5px solid transparent; border-top-color: #2c3e50;
                    opacity: 0; visibility: hidden; transition: opacity .08s; pointer-events: none; z-index: 30; }
  .btn-ic:hover::after, .btn-ic:hover::before { opacity: 1; visibility: visible; }
  .ops .btn-ic:last-child::after { left: auto; right: 0; transform: none; }   /* 最右邊的提示靠右，避免超出畫面 */
  .btn-ic.copy   { --c: #00a884; }
  .btn-ic.result { --c: #6c5ce7; }
  .btn-ic.stop   { --c: #34495e; }
  .btn-ic.edit   { --c: #f39c12; }
  .btn-ic.dup    { --c: #2c7be5; }
  .st { display: inline-block; padding: 2px 12px; border-radius: 12px; font-size: 13px; white-space: nowrap; }
  .st-open { background: #e6f7ef; color: #0a7d57; border: 1px solid #b3e6cf; }
  .st-closed { background: #eceff1; color: #78838c; border: 1px solid #d5dbdf; }
  .btn-ic:disabled { opacity: .35; cursor: not-allowed; }
  .btn-ic:disabled:hover { background: #f4f6f8; border-color: #e4e8ec; color: var(--c, #5a6470);
                           transform: none; box-shadow: none; }
  .btn-cancel { background: #95a5a6; color: #fff; }
  /* 受調查人員：名牌式輸入 */
  .ptags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; min-height: 46px;
           border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: text; }
  .ptags:focus-within { border-color: #2c7be5; }
  .ptag { display: inline-flex; align-items: center; gap: 7px; background: #eef6f3; border: 1px solid #bfe3d8;
          border-radius: 14px; padding: 4px 11px; font-size: 13px; cursor: pointer; user-select: none;
          transition: background .15s, border-color .15s; }
  .ptag:hover { border-color: #00a884; }
  .ptag.host { background: #e8f1fd; border-color: #9cc3f5; font-weight: 600; }
  .ptag .x { color: #999; font-weight: 700; line-height: 1; }
  .ptag .x:hover { color: #e74c3c; }
  .ptags input { border: none; outline: none; flex: 1; min-width: 240px; font-size: 14px; padding: 4px; width: auto; }
  .pbar { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 13px; }
  .pbar a { color: #2c7be5; text-decoration: none; }
  .pbar a:hover { text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-bottom: 1px solid #eee; padding: 10px 8px; text-align: left; vertical-align: top; }
  th { background: #fafafa; color: #555; font-weight: 600; }
  .muted { color: #999; font-size: 13px; }
  #surveyList td { vertical-align: middle; }
  .prog { display: inline-block; padding: 2px 10px; border-radius: 12px; background: #eee; color: #666; font-size: 13px; }
  .prog.full { background: #28a745; color: #fff; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: #fff;
           padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  /* 結果表：欄=人名，列=日期+時間 */
  #resultArea table { width: auto; min-width: 60%; font-size: 13px; }
  #resultArea th, #resultArea td { border: 1px solid #ddd; text-align: center; padding: 4px 10px; vertical-align: middle; }
  #resultArea th.dcell { background: #f7f9f8; white-space: nowrap; }
  #resultArea th.tcell { font-weight: 400; color: #555; white-space: nowrap; }
  #resultArea td.yes { background: #d2f4e8; color: #0a7d57; font-weight: 700; }
  #resultArea td.no { color: #ddd; }
  #resultArea td.nr { background: #f5f5f5; color: #bbb; }
  #resultArea tr.hourtop th.tcell, #resultArea tr.hourtop td { border-top: 2px solid #bbb; }
  /* 符合會議時間的區塊：整塊一個綠色大框（用四邊框線拼出外框） */
  #resultArea .okt { border-top: 3px solid #28a745 !important; }
  #resultArea .okb { border-bottom: 3px solid #28a745 !important; }
  #resultArea .okl { border-left: 3px solid #28a745 !important; }
  #resultArea .okr { border-right: 3px solid #28a745 !important; }
  .meetbox { margin: 10px 0 14px; font-size: 14px; color: #555; }
  .meetbox input { width: 70px; display: inline-block; padding: 4px 6px; }
  #resultArea a { color: #2c7be5; font-size: 14px; text-decoration: none; }
  #resultArea a:hover { text-decoration: underline; }
  /* 調查結論：共同有空時段的視覺化 */
  .concl { background: #f6fbf8; border: 1px solid #cde9db; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  .concl .ctitle { font-size: 15px; font-weight: 700; color: #1d7a35; margin-bottom: 8px; }
  .concl .cnote { font-size: 13px; color: #888; margin-top: 6px; }
  .concl .cday { margin: 5px 0; font-size: 14px; }
  .concl .dlabel { display: inline-block; min-width: 110px; font-weight: 600; color: #2c3e50; }
  .concl .none { color: #c0c6c3; font-size: 13px; }
  .chip { display: inline-block; margin: 2px 8px 2px 0; padding: 4px 14px; border-radius: 14px; font-size: 13px;
          background: #e9ecef; color: #888; border: 1px solid #d4d8db; white-space: nowrap; }
  .chip.fit { background: #28a745; color: #fff; border-color: #28a745; font-weight: 600; }
  /* 綠色時段內的「產生會通」小按鈕：白底膠囊，滑上立即顯示自製提示（不用原生 title） */
  .cbtn { position: relative; display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 10px;
          font-size: 12px; font-weight: 400; cursor: pointer; background: #fff; color: #1d8c38;
          border: 1px solid #bfe3c9; user-select: none; transition: background .15s, transform .15s; }
  .cbtn:hover { background: #eafff1; transform: translateY(-1px); }
  .cbtn::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%;
                 transform: translateX(-50%); background: #2c3e50; color: #fff; font-size: 12px; font-weight: 400;
                 padding: 6px 10px; border-radius: 6px; white-space: nowrap; opacity: 0; visibility: hidden;
                 transition: opacity .08s; pointer-events: none; z-index: 30; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .cbtn::before { content: ''; position: absolute; bottom: calc(100% + 3px); left: 50%;
                  transform: translateX(-50%); border: 5px solid transparent; border-top-color: #2c3e50;
                  opacity: 0; visibility: hidden; transition: opacity .08s; pointer-events: none; z-index: 30; }
  .cbtn:hover::after, .cbtn:hover::before { opacity: 1; visibility: visible; }
</style>
</head>
<body>
<header><h1>⏰ 時間調查 - 後台維護</h1></header>
<div class="container">

  <div class="card">
    <h2 id="formTitle">建立新調查</h2>
    <input type="hidden" id="editId">
    <div class="row">
      <div style="flex:2">
        <label>調查名稱</label>
        <input id="fName" placeholder="例如：六月份部門會議時間調查">
      </div>
    </div>
    <div class="row">
      <div><label>開始日期</label><input type="date" id="fStartDate"></div>
      <div><label>結束日期</label><input type="date" id="fEndDate"></div>
      <div><label>每日開始時間</label><input type="time" id="fStartTime" step="1800" value="09:00"></div>
      <div><label>每日結束時間</label><input type="time" id="fEndTime" step="1800" value="17:30"></div>
    </div>
    <div class="row">
      <div>
        <label>受調查人員（輸入姓名按 Enter，或直接貼上整串名單；👑 第一位為<b>會議主持人</b>，點名牌可改設）</label>
        <div class="ptags" id="pTags">
          <input id="pInput" placeholder="輸入姓名後按 Enter，或貼上「王大明;陳小明;李中明」這類名單">
        </div>
        <div class="pbar">
          <span class="muted" id="pCount">共 0 人</span>
          <a href="javascript:void(0)" onclick="copyParticipants()">📋 複製全部人名</a>
        </div>
      </div>
    </div>
    <button class="btn-primary" onclick="saveSurvey()" id="saveBtn">建立調查</button>
    <button class="btn-cancel" onclick="resetForm()" id="cancelBtn" style="display:none">取消編輯</button>
  </div>

  <div class="card">
    <h2>調查清單 <span id="notifUi" style="float:right;font-weight:400;font-size:13px"></span></h2>
    <table>
      <thead>
        <tr><th>調查名稱</th><th>日期範圍</th><th>每日時間</th><th>人員</th><th>填寫狀況</th><th>目前狀態</th><th style="width:210px">操作</th></tr>
      </thead>
      <tbody id="surveyList"></tbody>
    </table>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h2 id="resultTitle">調查結果</h2>
    <div class="meetbox">
      會議時間：<input type="number" id="meetHours" min="0.5" step="0.5" value="1" oninput="renderResult()"> 小時
      <span class="muted">　若有連續 n 小時「每個人都有空」的時段，會以綠框標示</span>
    </div>
    <div id="resultArea" style="overflow-x:auto"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);

/* 發起者識別碼：存在瀏覽器 localStorage，後台只看得到自己發起的調查 */
const OWNER = (() => {
  let t = localStorage.getItem('ownerToken');
  if (!t) {
    t = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
    localStorage.setItem('ownerToken', t);
  }
  return t;
})();

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function api(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'X-Owner-Token': OWNER }, opts.headers || {});
  const res = await fetch(url, opts);
  if (!res.ok) {
    let msg = '操作失敗';
    try { msg = (await res.json()).message || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}

let surveys = [];
let resultState = null;   // { survey, responses }

/* 操作鈕的線條風 SVG 圖示（Feather icons 風格） */
const ICONS = {
  link:  '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
  chart: '<svg viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>',
  stop:  '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
  edit:  '<svg viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>',
  dup:   '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
};

const WEEK = ['日','一','二','三','四','五','六'];

/* "2026-06-10" -> "2026/6/10" */
function fmtYmd(d) {
  const [y, m, dd] = d.split('-');
  return y + '/' + (+m) + '/' + (+dd);
}
/* "2026-06-10" -> "6/10" */
function fmtMd(d) {
  const [, m, dd] = d.split('-');
  return (+m) + '/' + (+dd);
}

/* 自動刪除倒數提示：housekeeping 批次會在「迄日經過 7 天」後刪除調查 */
function deleteHint(s) {
  const del = new Date(s.endDate + 'T00:00:00');
  del.setDate(del.getDate() + 7);   // 迄日+7 當晚的批次（預設 20:00）就會刪除
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = Math.round((del - today) / 86400000);
  return days > 0 ? '🗑 約 ' + days + ' 天後自動刪除' : '🗑 今晚批次將自動刪除';
}

async function loadSurveys() {
  surveys = await api('/api/surveys');
  // 取得各調查的已填寫人數
  const counts = await Promise.all(
    surveys.map(s => api('/api/surveys/' + s.id + '/responses')
      .then(rs => rs.filter(r => s.participants.includes(r.participantName)).length)
      .catch(() => 0))
  );
  const tbody = $('surveyList');
  tbody.innerHTML = '';
  if (surveys.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="muted">尚無調查，請先建立。</td></tr>';
    return;
  }
  surveys.forEach((s, i) => {
    const total = s.participants.length;
    const done = counts[i];
    const full = total > 0 && done >= total;
    const closed = !!s.closedAt;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${esc(s.name)}</td>
      <td>${fmtYmd(s.startDate)} ~ ${fmtYmd(s.endDate)}</td>
      <td>${s.startTime.slice(0,5)} ~ ${s.endTime.slice(0,5)}</td>
      <td title="${esc(s.participants.join('、'))}">${total} 人</td>
      <td><span class="prog${full ? ' full' : ''}" title="${full ? '全部填寫完成' : '尚有 ' + (total - done) + ' 人未填'}">${done} / ${total}${full ? ' ✓' : ''}</span></td>
      <td><span class="st ${closed ? 'st-closed' : 'st-open'}">${closed ? '已結束' : '進行中'}</span>
        <div class="muted" style="font-size:12px;margin-top:4px"
             title="調查迄日經過 7 天後，系統批次（每晚 20:00）會自動刪除調查與填寫資料">${deleteHint(s)}</div></td>
      <td><div class="ops">
        <button class="btn-ic copy" onclick="copyLink('${s.id}')" ${closed ? 'disabled' : ''}
          data-tip="${closed ? '調查已結束，連結已停用' : '複製調查連結，傳給參與者即可填寫'}" aria-label="複製調查連結">${ICONS.link}</button>
        <button class="btn-ic result" onclick="showResult('${s.id}')" data-tip="查看填寫狀況與共同有空的時段" aria-label="查看結果">${ICONS.chart}</button>
        <button class="btn-ic stop" onclick="closeSurvey('${s.id}')" ${closed ? 'disabled' : ''}
          data-tip="${closed ? '調查已結束' : '結束調查，參與者將無法再填寫'}" aria-label="結束調查">${ICONS.stop}</button>
        <button class="btn-ic edit" onclick="editSurvey('${s.id}')" ${closed ? 'disabled' : ''}
          data-tip="${closed ? '調查已結束，無法編輯' : '修改調查名稱、日期時間與人員名單'}" aria-label="編輯調查">${ICONS.edit}</button>
        <button class="btn-ic dup" onclick="duplicateSurvey('${s.id}')"
          data-tip="複製主旨與人員，開啟新的會議調查" aria-label="複製調查">${ICONS.dup}</button>
      </div></td>`;
    tbody.appendChild(tr);
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function surveyUrl(id) {
  return location.origin + '/s/' + id;
}

function copyLink(id) {
  const url = surveyUrl(id);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(() => toast('已複製調查連結：' + url));
  } else {
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('已複製調查連結：' + url);
  }
}

/* Date -> "yyyy-MM-dd" */
function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* 日期預設：明天開始、共五天 */
function setDefaultDates() {
  const s = new Date();
  s.setDate(s.getDate() + 1);
  const e = new Date(s);
  e.setDate(e.getDate() + 4);
  $('fStartDate').value = ymd(s);
  $('fEndDate').value = ymd(e);
}

/* ---------- 受調查人員：名牌式輸入 ---------- */
let plist = [];   // 人員名單，第 0 位為會議主持人

function renderTags() {
  const box = $('pTags');
  const input = $('pInput');
  box.querySelectorAll('.ptag').forEach(el => el.remove());
  plist.forEach((name, i) => {
    const tag = document.createElement('span');
    tag.className = 'ptag' + (i === 0 ? ' host' : '');
    tag.title = i === 0 ? '會議主持人' : '點擊設為會議主持人（移到第一位）';
    const label = document.createElement('span');
    label.textContent = (i === 0 ? '👑 ' : '') + name;
    const x = document.createElement('span');
    x.className = 'x';
    x.textContent = '×';
    x.title = '移除 ' + name;
    x.onclick = e => {
      e.stopPropagation();
      plist.splice(i, 1);
      renderTags();
    };
    tag.onclick = () => {
      if (i === 0) return;
      plist.splice(i, 1);
      plist.unshift(name);
      renderTags();
      toast('已將「' + name + '」設為會議主持人');
    };
    tag.append(label, x);
    box.insertBefore(tag, input);
  });
  $('pCount').textContent = '共 ' + plist.length + ' 人' + (plist.length ? '（👑 ' + plist[0] + ' 為主持人）' : '');
}

/* 把整串文字拆成多位人名：支援換行、逗號、分號、頓號、全形標點與空白 */
function addNames(text) {
  let dup = 0;
  for (const n of String(text).split(/[\n\r,;，；、\s]+/)) {
    const name = n.trim();
    if (!name) continue;
    if (plist.includes(name)) { dup++; continue; }
    plist.push(name);
  }
  if (dup > 0) toast('已略過 ' + dup + ' 個重複姓名');
  renderTags();
}

function commitPInput() {
  const v = $('pInput').value.trim();
  if (v) addNames(v);
  $('pInput').value = '';
}

function copyParticipants() {
  if (plist.length === 0) return toast('名單是空的');
  const text = plist.join(';');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast('已複製 ' + plist.length + ' 位人名'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('已複製 ' + plist.length + ' 位人名');
  }
}

$('pInput').addEventListener('keydown', e => {
  if (e.isComposing) return;   // 中文輸入法選字中的 Enter 不處理
  if (e.key === 'Enter' || [',', ';', '、', '，', '；'].includes(e.key)) {
    e.preventDefault();
    commitPInput();
  } else if (e.key === 'Backspace' && !$('pInput').value && plist.length) {
    plist.pop();
    renderTags();
  }
});
$('pInput').addEventListener('blur', commitPInput);
$('pInput').addEventListener('paste', e => {
  e.preventDefault();
  addNames((e.clipboardData || window.clipboardData).getData('text'));
});
$('pTags').addEventListener('click', e => {
  if (e.target === $('pTags')) $('pInput').focus();
});

function readForm() {
  commitPInput();   // 輸入框還有沒按 Enter 的姓名，先收進名單
  return {
    name: $('fName').value.trim(),
    startDate: $('fStartDate').value,
    endDate: $('fEndDate').value,
    startTime: $('fStartTime').value,
    endTime: $('fEndTime').value,
    participants: [...plist]
  };
}

async function saveSurvey() {
  const body = readForm();
  if (!body.name) return toast('請輸入調查名稱');
  if (!body.startDate || !body.endDate) return toast('請選擇日期範圍');
  if (body.endDate < body.startDate) return toast('結束日期不可早於開始日期');
  if (!body.startTime || !body.endTime || body.endTime <= body.startTime) return toast('時間範圍不正確');
  if (body.participants.length === 0) return toast('請至少輸入一位受調查人員');

  const editId = $('editId').value;
  try {
    await api(editId ? '/api/surveys/' + editId : '/api/surveys', {
      method: editId ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    toast(editId ? '已更新調查' : '已建立調查');
    resetForm();
    loadSurveys();
  } catch (e) {
    toast(e.message);
  }
}

function editSurvey(id) {
  const s = surveys.find(x => x.id === id);
  if (!s) return;
  $('editId').value = s.id;
  $('fName').value = s.name;
  $('fStartDate').value = s.startDate;
  $('fEndDate').value = s.endDate;
  $('fStartTime').value = s.startTime.slice(0,5);
  $('fEndTime').value = s.endTime.slice(0,5);
  plist = [...s.participants];
  renderTags();
  $('formTitle').textContent = '編輯調查：' + s.name;
  $('saveBtn').textContent = '儲存修改';
  $('cancelBtn').style.display = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* 複製調查：帶入主旨與人員到「建立新調查」表單（日期回到預設的明天起五天） */
function duplicateSurvey(id) {
  const s = surveys.find(x => x.id === id);
  if (!s) return;
  resetForm();
  $('fName').value = s.name;
  plist = [...s.participants];
  renderTags();
  $('formTitle').textContent = '建立新調查(複製自:' + s.name + ')';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  toast('已帶入「' + s.name + '」的主旨與人員，確認日期後即可建立');
}

function resetForm() {
  $('editId').value = '';
  $('fName').value = '';
  setDefaultDates();
  $('fStartTime').value = '09:00';
  $('fEndTime').value = '17:30';
  plist = [];
  $('pInput').value = '';
  renderTags();
  $('formTitle').textContent = '建立新調查';
  $('saveBtn').textContent = '建立調查';
  $('cancelBtn').style.display = 'none';
}

async function closeSurvey(id) {
  const s = surveys.find(x => x.id === id);
  if (!confirm('確定結束調查「' + (s ? s.name : '') + '」？結束後參與者將無法再填寫時間。')) return;
  try {
    await api('/api/surveys/' + id + '/close', { method: 'POST' });
    toast('調查已結束');
    loadSurveys();
  } catch (e) {
    toast(e.message);
  }
}

/* ---------- 結果檢視 ---------- */
function dateList(start, end) {
  const out = [];
  let d = new Date(start + 'T00:00:00');
  const e = new Date(end + 'T00:00:00');
  while (d <= e) {
    // 跳過週六(6)、週日(0)
    if (d.getDay() !== 0 && d.getDay() !== 6) {
      out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
    }
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function timeSlots(startTime, endTime) {
  const out = [];
  let [h, m] = startTime.slice(0,5).split(':').map(Number);
  const [eh, em] = endTime.slice(0,5).split(':').map(Number);
  while (h * 60 + m < eh * 60 + em) {
    const t = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
    // 12:00~13:00 為午休，不列入調查時段
    if (t < '12:00' || t >= '13:00') out.push(t);
    m += 30;
    if (m >= 60) { m -= 60; h++; }
  }
  return out;
}

let detailOpen = false;   // 調查明細表預設隱藏

async function showResult(id) {
  const survey = surveys.find(x => x.id === id);
  const responses = await api('/api/surveys/' + id + '/responses');
  if (!resultState || resultState.survey.id !== id) detailOpen = false;   // 換調查時收合明細
  resultState = { survey, responses };
  $('resultCard').style.display = '';
  $('resultTitle').textContent = '調查結果：' + survey.name + (survey.closedAt ? '（已結束）' : '');
  renderResult();
  $('resultCard').scrollIntoView({ behavior: 'smooth' });
}

/* 找出每一天「每個人都有空」的最大連續區塊（午休 12:00~13:00 會中斷連續性）。
   回傳 [{ date, slots: ['09:00', ...] }] */
function computeCommonRuns(survey, sets, dates, times) {
  const ps = survey.participants;
  const everyoneFree = slot => ps.length > 0 && ps.every(p => sets[p] && sets[p].has(slot));
  const toMin = t => (+t.slice(0,2)) * 60 + (+t.slice(3,5));
  const runs = [];
  for (const d of dates) {
    let run = [];
    const flush = () => {
      if (run.length > 0) runs.push({ date: d, slots: run });
      run = [];
    };
    times.forEach((t, i) => {
      if (run.length > 0 && toMin(t) !== toMin(times[i - 1]) + 30) flush();
      if (everyoneFree(d + 'T' + t)) run.push(t);
      else flush();
    });
    flush();
  }
  return runs;
}

/* "10:30" + 30分 -> "11:00" */
function plus30(t) {
  let h = +t.slice(0,2), m = +t.slice(3,5) + 30;
  if (m >= 60) { m -= 60; h++; }
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

/* ---------- 會議邀請 .ics 下載 ---------- */
/* iCalendar 文字欄位的跳脫規則（RFC 5545） */
function icsEscape(s) {
  return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
}

/* 由按鈕的 data-date / data-from 取得會議起迄：自區塊開頭起算「會議時間」長度 */
function meetingRange(el) {
  const date = el.dataset.date, from = el.dataset.from;
  const meetHours = parseFloat($('meetHours').value) || 1;
  let end = from;
  for (let i = 0; i < Math.max(1, Math.round(meetHours * 2)); i++) end = plus30(end);
  return { date, from, end };
}

/* 「📅 .ics」按鈕：產生會議邀請 .ics 並下載。
   主旨＝調查名稱；與會人員寫入說明（名單只有姓名沒有 email，無法自動帶入收件者欄位）。
   用 METHOD:PUBLISH 讓 Outlook 以「可編輯的約會」開啟，按「邀請出席者」即可寄送會通 */
function downloadIcs(el) {
  if (!resultState) return;
  const survey = resultState.survey;
  const { date, from, end } = meetingRange(el);
  const fmt = t => date.replace(/-/g, '') + 'T' + t.replace(':', '') + '00';
  const desc = '與會人員：' + survey.participants.join('、') +
               '\n（由時間調查產生；收件者已帶入姓名，請按 Alt+K「檢查名稱」解析為通訊錄 email 後再傳送）';
  // 出席者只有姓名沒有 email：mailto 直接放姓名（不含 @），Outlook 會視為未解析名稱，
  // 開啟後按 Alt+K（檢查名稱）即可由公司通訊錄解析成正式收件者
  const attendees = survey.participants.map(p =>
      'ATTENDEE;ROLE=REQ-PARTICIPANT;RSVP=TRUE;CN=' + icsEscape(p) + ':mailto:' + p);
  const ics = [
    'BEGIN:VCALENDAR',
    'PRODID:-//TimeSurvey//ZH-TW',
    'VERSION:2.0',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)) + '@timesurvey',
    'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
    'DTSTART:' + fmt(from),
    'DTEND:' + fmt(end),
    'SUMMARY:' + icsEscape(survey.name),
    'DESCRIPTION:' + icsEscape(desc),
    ...attendees,
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  a.download = '會議邀請-' + survey.name + '-' + fmtMd(date).replace('/', '') + '-' + from.replace(':', '') + '.ics';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('已下載會議邀請（' + fmtMd(date) + ' ' + from + ' ~ ' + end + '），以 Outlook 開啟即可寄送');
}

/* 「🌐 網頁版」按鈕：在 Outlook 網頁版開啟預填好的新會議（需登入 Microsoft 帳號） */
function openOutlookWeb(el) {
  if (!resultState) return;
  const survey = resultState.survey;
  const { date, from, end } = meetingRange(el);
  const url = 'https://outlook.office.com/calendar/deeplink/compose?path=/calendar/action/compose&rru=addevent' +
      '&subject=' + encodeURIComponent(survey.name) +
      '&startdt=' + date + 'T' + from + ':00' +
      '&enddt=' + date + 'T' + end + ':00' +
      '&to=' + encodeURIComponent(survey.participants.join(';')) +
      '&body=' + encodeURIComponent('與會人員：' + survey.participants.join('、') + '（由時間調查產生）');
  window.open(url, '_blank');
}

function renderResult() {
  if (!resultState) return;
  const { survey, responses } = resultState;
  const dates = dateList(survey.startDate, survey.endDate);
  const times = timeSlots(survey.startTime, survey.endTime);
  const ps = survey.participants;

  // 每人勾選的時段集合
  const sets = {};
  for (const r of responses) {
    sets[r.participantName] = new Set((r.slots || '').split(',').filter(x => x));
  }
  const respondedSet = new Set(responses.map(r => r.participantName));
  const notAnswered = ps.filter(p => !respondedSet.has(p));

  const meetHours = parseFloat($('meetHours').value) || 1;
  const need = Math.max(1, Math.round(meetHours * 2));   // 30 分鐘為一格
  const runs = computeCommonRuns(survey, sets, dates, times);
  // 長度足以容納會議的區塊，在主表以綠色大框標示
  const okFrames = new Map();
  for (const r of runs) {
    if (r.slots.length < need) continue;
    r.slots.forEach((t, idx) => okFrames.set(r.date + 'T' + t,
      { top: idx === 0, bottom: idx === r.slots.length - 1 }));
  }

  /* ---- 調查結論：視覺化顯示所有人共同有空的時段 ---- */
  let html = '<div class="concl"><div class="ctitle">📊 調查結論：每個人都有空的時段</div>';
  if (notAnswered.length) {
    html += '<div class="cnote">⚠ ' + esc(notAnswered.join('、')) + ' 尚未填寫，目前無法得出共同時段。</div>';
  } else if (runs.length === 0) {
    html += '<div class="cnote">目前沒有所有人共同有空的時段。</div>';
  } else {
    for (const d of dates) {
      const w = WEEK[new Date(d + 'T00:00:00').getDay()];
      const dayRuns = runs.filter(r => r.date === d);
      html += '<div class="cday"><span class="dlabel">' + fmtMd(d) + '（週' + w + '）</span>';
      if (dayRuns.length === 0) {
        html += '<span class="none">— 無共同時段 —</span>';
      } else {
        for (const r of dayRuns) {
          const from = r.slots[0];
          const to = plus30(r.slots[r.slots.length - 1]);
          const hrs = parseFloat((r.slots.length * 0.5).toFixed(1));
          const fit = r.slots.length >= need;
          if (fit) {
            const attrs = ' data-date="' + d + '" data-from="' + from + '"';
            html += '<span class="chip fit">' + from + ' ~ ' + to + '（' + hrs + ' 小時）✓' +
                    '<span class="cbtn"' + attrs + ' onclick="downloadIcs(this)"' +
                    ' data-tip="下載「會議邀請.ics」（' + meetHours + ' 小時，自 ' + from + ' 起），以桌面版 Outlook 開啟寄送會通">📅</span>' +
                    '<span class="cbtn"' + attrs + ' onclick="openOutlookWeb(this)"' +
                    ' data-tip="在 Outlook 網頁版開啟新會議（' + meetHours + ' 小時，自 ' + from + ' 起），主旨、時間、與會人員已帶入">🌐</span>' +
                    '</span>';
          } else {
            html += '<span class="chip" title="長度不足 ' + meetHours + ' 小時">' +
                    from + ' ~ ' + to + '（' + hrs + ' 小時）</span>';
          }
        }
      }
      html += '</div>';
    }
    html += '<div class="cnote muted">綠色＝長度可容納 ' + meetHours + ' 小時會議的時段<br>' +
            '灰色＝大家都有空但長度不足<br>' +
            '「📅」可下載會議邀請檔（桌面版 Outlook）<br>' +
            '「🌐」可在 Outlook 網頁版開啟新會議</div>';
  }
  html += '</div>';

  html += '<p class="muted">未填寫：' + (notAnswered.length ? esc(notAnswered.join('、')) : '（無，全部已填寫）') + '</p>';

  // 明細表預設隱藏，點連結才展開
  html += '<p><a href="javascript:void(0)" id="detailToggle" onclick="toggleDetail()">' +
          (detailOpen ? '隱藏調查明細 ▲' : '顯示調查明細 ▼') + '</a></p>';
  html += '<div id="detailWrap"' + (detailOpen ? '' : ' style="display:none"') + '>';

  html += '<table><thead><tr><th>日期</th><th>時間</th>';
  for (const p of ps) html += '<th>' + esc(p) + '</th>';
  html += '</tr></thead><tbody>';

  for (const d of dates) {
    const w = WEEK[new Date(d + 'T00:00:00').getDay()];
    times.forEach((t, i) => {
      const slot = d + 'T' + t;
      const f = okFrames.get(slot);   // 在綠框區塊內時，f.top/f.bottom 標示區塊上下緣
      const edge = f ? (f.top ? ' okt' : '') + (f.bottom ? ' okb' : '') : '';
      html += '<tr class="' + (t.endsWith(':00') ? 'hourtop' : '') + '">';
      if (i === 0) {
        html += '<th class="dcell" rowspan="' + times.length + '">' + fmtMd(d) + '（週' + w + '）</th>';
      }
      html += '<th class="tcell' + (f ? ' okl' : '') + edge + '">' + t + '</th>';
      ps.forEach((p, pi) => {
        let cls;
        if (!respondedSet.has(p)) cls = 'nr';
        else if (sets[p].has(slot)) cls = 'yes';
        else cls = 'no';
        cls += edge + (f && pi === ps.length - 1 ? ' okr' : '');
        if (!respondedSet.has(p)) {
          html += '<td class="' + cls + '" title="' + esc(p) + ' 尚未填寫">—</td>';
        } else {
          html += '<td class="' + cls + '">' + (sets[p].has(slot) ? '✓' : '') + '</td>';
        }
      });
      html += '</tr>';
    });
  }
  html += '</tbody></table>';
  html += '<p class="muted">✓＝可出席；—＝尚未填寫；綠色大框＝每個人都有空、且可容納 ' + meetHours + ' 小時會議的連續時段區塊。</p>';
  html += '</div>';
  $('resultArea').innerHTML = html;
}

function toggleDetail() {
  detailOpen = !detailOpen;
  $('detailWrap').style.display = detailOpen ? '' : 'none';
  $('detailToggle').textContent = detailOpen ? '隱藏調查明細 ▲' : '顯示調查明細 ▼';
}

/* ---------- 完成通知（WebSocket 即時推播） ---------- */
function updateNotifUi() {
  const el = $('notifUi');
  if (!('Notification' in window)) { el.textContent = ''; return; }
  if (Notification.permission === 'granted') {
    el.innerHTML = '🔔 完成通知已開啟';
  } else if (Notification.permission === 'denied') {
    el.innerHTML = '🔕 瀏覽器已封鎖通知（請至網站設定開啟）';
  } else {
    el.innerHTML = '<button class="btn-sm btn-primary" onclick="askNotif()">開啟完成通知</button>';
  }
}
function askNotif() {
  Notification.requestPermission().then(() => {
    updateNotifUi();
    if (Notification.permission === 'granted') toast('完成通知已開啟');
  });
}

function notifyDone(m) {
  const msg = '調查「' + m.name + '」已全部填寫完成（' + m.total + '/' + m.total + '）！';
  toast(msg);
  if ('Notification' in window && Notification.permission === 'granted') {
    const n = new Notification('⏰ 時間調查完成', { body: msg });
    n.onclick = () => { window.focus(); showResult(m.surveyId); n.close(); };
  }
}

/* 與後端建立 WebSocket，最後一人填寫完成時由伺服器即時推播 */
function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const ws = new WebSocket(proto + location.host + '/ws/notify?owner=' + encodeURIComponent(OWNER));
  ws.onmessage = e => {
    try {
      const m = JSON.parse(e.data);
      if (m.type === 'surveyComplete') {
        notifyDone(m);
        loadSurveys();   // 重新整理清單，填寫狀況變綠
      } else if (m.type === 'responseUpdated') {
        loadSurveys();   // 任一人填寫即更新清單的填寫狀況
        // 若正開著該調查的結果視圖，重抓回覆並重繪（不捲動頁面）
        if (resultState && resultState.survey.id === m.surveyId) {
          api('/api/surveys/' + m.surveyId + '/responses').then(rs => {
            resultState.responses = rs;
            renderResult();
          }).catch(() => {});
        }
      }
    } catch (err) { /* 忽略非 JSON 訊息 */ }
  };
  ws.onclose = () => setTimeout(connectWs, 3000);   // 斷線自動重連
}

setDefaultDates();
loadSurveys();
updateNotifUi();
connectWs();
// 通知預設啟用：進入後台就自動向瀏覽器要求授權
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission().then(updateNotifUi);
}
