server.port=8080

# 讓錯誤回應帶出訊息，前端才能顯示中文錯誤提示
server.error.include-message=always

# Housekeeping 批次啟動時間（crontab 格式：秒 分 時 日 月 週），預設每晚 20:00
# 迄日已經過 7 日（以批次啟動日計算）的調查會被清除
housekeeping.cron=0 0 20 * * *

# H2 file-based database (data persists in ./data/timesurvey.mv.db)
# CIPHER=AES：資料庫檔案以 AES 加密儲存（磁碟上的 .mv.db 為密文，無密碼無法開啟）
# H2 加密連線的密碼格式為「檔案加密密碼<空格>使用者密碼」兩段
# 注意：首次啟用加密前，請先刪除舊的未加密 ./data/timesurvey.mv.db（換密碼等同重新初始化）
spring.datasource.url=jdbc:h2:file:./data/timesurvey;CIPHER=AES;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=6yhn&UJM 6yhn&UJM

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at /h2-console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
