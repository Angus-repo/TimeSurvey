server.port=8080

# 讓錯誤回應帶出訊息，前端才能顯示中文錯誤提示
server.error.include-message=always

# Housekeeping 批次啟動時間（crontab 格式：秒 分 時 日 月 週），預設每晚 20:00
# 迄日已經過 7 日（以批次啟動日計算）的調查會被清除
housekeeping.cron=0 0 20 * * *

# H2 file-based database (data persists in ./data/timesurvey.mv.db)
spring.datasource.url=jdbc:h2:file:./data/timesurvey;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
# sa 的密碼不寫在此檔，因此本檔不需隨密碼變動而進版控：
# 首次建立資料庫時，DbPasswordEnvironmentPostProcessor 會產生強隨機密碼，用 Jasypt
# 加密後存進 ./data/db-secret.properties（位於已 gitignore 的 data/，不進版控）；
# 之後每次啟動由 jasypt-spring-boot 以主金鑰自動解密注入。主金鑰優先取環境變數
# JASYPT_ENCRYPTOR_PASSWORD；未提供時改用主機名稱（hostname）作為預設主金鑰。
# 要整組重置（含密碼）請刪除整個 data/ 目錄。

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at /h2-console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
