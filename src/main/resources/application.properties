server.port=8080

# 讓錯誤回應帶出訊息，前端才能顯示中文錯誤提示
server.error.include-message=always

# Housekeeping 批次啟動時間（crontab 格式：秒 分 時 日 月 週），預設每晚 20:00
# 迄日已經過 7 日（以批次啟動日計算）的調查會被清除
housekeeping.cron=0 0 20 * * *

# H2 file-based database (data persists in ./data/timesurvey.mv.db)
# 注意：sa 的密碼是在「第一次建立資料庫檔案」時定下來的；
# 若已有用舊密碼（或空密碼）建立的 ./data/timesurvey.mv.db，請先刪除再啟動，否則會連不上
spring.datasource.url=jdbc:h2:file:./data/timesurvey;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
# 密碼以 Jasypt 加密存放（明文為 sa 的登入密碼），啟動時才在記憶體中解密。
# 解密用的主金鑰由環境變數 JASYPT_ENCRYPTOR_PASSWORD 提供，不寫在任何設定檔裡。
# 重新產生密文：
#   mvn jasypt:encrypt-value -Djasypt.encryptor.password=主金鑰 -Djasypt.plugin.value=新密碼
spring.datasource.password=ENC(+A8s9TBhoa2tufeI5GSUW1pMztH/Kp/vH+eEqLfujA4iDMbndiDZFhsRP4+A4uN7)

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at /h2-console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
