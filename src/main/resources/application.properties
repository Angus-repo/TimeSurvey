server.port=8080

# 讓錯誤回應帶出訊息，前端才能顯示中文錯誤提示
server.error.include-message=always

# H2 file-based database (data persists in ./data/timesurvey.mv.db)
spring.datasource.url=jdbc:h2:file:./data/timesurvey;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at /h2-console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
