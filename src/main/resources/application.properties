server.port=8080

# 讓錯誤回應帶出訊息，前端才能顯示中文錯誤提示
server.error.include-message=always

# Housekeeping 批次啟動時間（crontab 格式：秒 分 時 日 月 週），預設每晚 20:00
# 迄日已經過 7 日（以批次啟動日計算）的調查會被清除
housekeeping.cron=0 0 20 * * *

# H2 file-based database (data persists in ./data/timesurvey.mv.db)
# 注意：sa 的密碼是在「第一次建立資料庫檔案」時定下來的；
# 若已有用舊密碼（或空密碼）建立的 ./data/timesurvey.mv.db，請先刪除再啟動，否則會連不上
spring.datasource.url=jdbc:h2:file:./data/timesurvey;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=6yhn&UJM

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at /h2-console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
